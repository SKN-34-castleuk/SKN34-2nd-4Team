services:
  mysql:
    image: mysql:8.4
    container_name: cardops-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cardops}
      MYSQL_USER: ${MYSQL_USER:-cardops_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - cardops_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardops-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-cardops_app}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-cardops}
      MODEL_DIR: /app/outputs/models
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ALLOW_TEST_USER_SEEDING: ${ALLOW_TEST_USER_SEEDING:-false}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-30}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-900}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-}
      TEST_ANALYST_PASSWORD: ${TEST_ANALYST_PASSWORD:-}
      TEST_OPERATIONS_PASSWORD: ${TEST_OPERATIONS_PASSWORD:-}
      TEST_MARKETING_PASSWORD: ${TEST_MARKETING_PASSWORD:-}
    volumes:
      - ./outputs/models:/app/outputs/models:ro
      - ./data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_HOST: 0.0.0.0
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  cardops_mysql_data:
